name: MJ AI Small-Dataset LoRA Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mj-ai-lora-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.2" "transformers>=4.45,<5" "datasets>=2.20" "peft>=0.13" "accelerate>=1.0" safetensors

      - name: Validate and prepare training dataset
        run: |
          python training/prepare_dataset.py training/seed_data.jsonl /tmp/mj-ai-train.jsonl
          python - <<'PY'
          import json
          p = "/tmp/mj-ai-train.jsonl"
          rows = [json.loads(line) for line in open(p, encoding="utf-8") if line.strip()]
          if len(rows) < 25:
              raise SystemExit(f"Refusing to train on only {len(rows)} examples; add at least 25 reviewed examples.")
          print(f"Validated {len(rows)} chat examples")
          PY

      - name: Train MJ AI LoRA adapter
        run: |
          python training/train_lora.py \
            --model Qwen/Qwen2.5-0.5B-Instruct \
            --data /tmp/mj-ai-train.jsonl \
            --output training/output/mj-ai-lora \
            --epochs 2 \
            --max-length 768 \
            --rank 16

      - name: Verify adapter files
        run: |
          test -s training/output/mj-ai-lora/adapter_config.json
          find training/output/mj-ai-lora -maxdepth 1 -type f -printf '%f %s bytes\n'
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("training/output/mj-ai-lora/adapter_config.json")
          cfg = json.loads(p.read_text())
          assert cfg.get("peft_type") == "LORA", cfg
          weights = list(p.parent.glob("*.safetensors")) + list(p.parent.glob("*.bin"))
          assert weights and all(x.stat().st_size > 0 for x in weights), "Missing/empty adapter weights"
          print("Adapter verification passed")
          PY

      - name: Upload trained adapter
        uses: actions/upload-artifact@v4
        with:
          name: mj-ai-improved-lora-adapter
          path: training/output/mj-ai-lora/
          if-no-files-found: error
          retention-days: 30
