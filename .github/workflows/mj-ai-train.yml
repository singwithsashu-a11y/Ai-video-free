name: MJ AI Video Editing Model Training

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Hugging Face base model (GPU recommended for 1.5B)"
        required: true
        default: "Qwen/Qwen2.5-1.5B-Instruct"
        type: string
      epochs:
        description: "Training epochs (start with 1)"
        required: true
        default: "1"
        type: string
      max_length:
        description: "Maximum token length"
        required: true
        default: "512"
        type: string

permissions:
  contents: read

concurrency:
  group: mj-ai-training
  cancel-in-progress: false

jobs:
  train:
    name: Fine-tune MJ AI video-editing adapter
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch transformers datasets peft accelerate safetensors

      - name: Combine and validate reviewed training examples
        run: |
          cat training/seed_data.jsonl training/video_editing_skill_data.jsonl > /tmp/mj-ai-combined.jsonl
          python training/prepare_dataset.py /tmp/mj-ai-combined.jsonl /tmp/mj-ai-processed.jsonl
          python - <<'PY'
          import json
          p = "/tmp/mj-ai-processed.jsonl"
          rows = [json.loads(line) for line in open(p, encoding="utf-8") if line.strip()]
          if len(rows) < 25:
              raise SystemExit(f"Need at least 25 valid examples, found {len(rows)}")
          print(f"Validated {len(rows)} reviewed examples")
          PY

      - name: Fine-tune LoRA adapter
        env:
          MODEL_ID: ${{ inputs.model }}
          EPOCHS: ${{ inputs.epochs }}
          MAX_LENGTH: ${{ inputs.max_length }}
        run: |
          python training/train_lora.py \
            --model "$MODEL_ID" \
            --data /tmp/mj-ai-processed.jsonl \
            --output output/mj-ai-lora \
            --epochs "$EPOCHS" \
            --max-length "$MAX_LENGTH" \
            --rank 8 \
            --gradient-checkpointing

      - name: Verify adapter output
        run: |
          test -s output/mj-ai-lora/adapter_config.json
          python - <<'PY'
          from pathlib import Path
          p = Path("output/mj-ai-lora")
          weights = list(p.glob("adapter_model.safetensors")) + list(p.glob("adapter_model.bin"))
          if not weights or weights[0].stat().st_size == 0:
              raise SystemExit("Adapter weights missing or empty")
          print("Adapter config and weights verified.")
          PY

      - name: Upload trained adapter
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mj-ai-video-editing-lora-adapter
          path: output/mj-ai-lora/
          if-no-files-found: error
          retention-days: 14
